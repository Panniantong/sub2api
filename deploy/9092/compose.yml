name: sub2api-piao-9092

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  app:
    image: sub2api-piao-9092:${RELEASE_TAG:?RELEASE_TAG is required}
    container_name: sub2api-piao-9092-app
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    ports: ["0.0.0.0:9092:8080"]
    volumes: ["app_data:/app/data"]
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: release
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api_9092
      DATABASE_DBNAME: sub2api_9092
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: "30"
      DATABASE_MAX_IDLE_CONNS: "5"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDIS_POOL_SIZE: "128"
      REDIS_MIN_IDLE_CONNS: "5"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
      LOG_LEVEL: info
      TZ: Asia/Shanghai
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [isolated]
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-piao-9092-postgres
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    volumes: ["postgres_data:/var/lib/postgresql"]
    environment:
      POSTGRES_USER: sub2api_9092
      POSTGRES_DB: sub2api_9092
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB"]
    networks: [isolated]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api_9092 -d sub2api_9092 && psql -U sub2api_9092 -d sub2api_9092 -Atqc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: sub2api-piao-9092-redis
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    volumes: ["redis_data:/data"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    networks: [isolated]
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app_data:
    name: sub2api_piao_9092_app_data
  postgres_data:
    name: sub2api_piao_9092_postgres_data
  redis_data:
    name: sub2api_piao_9092_redis_data

networks:
  isolated:
    name: sub2api_piao_9092_network
    driver: bridge
